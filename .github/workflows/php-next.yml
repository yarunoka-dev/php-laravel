name: php-next

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.6'
          tools: composer:v2
          coverage: none

      # php+ ignores only the upper bound of php platform requirements:
      # transitive dependencies (e.g. nette/* behind laravel/framework) pin
      # a ceiling below the next PHP, which would stop the install before
      # any code runs. The canary asks whether THIS package survives the
      # next PHP, so their ceilings are lifted while every floor still holds.
      - name: Install dependencies from lock files
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=php+

      # Run the newest PHPUnit allowed by the constraint so failures point
      # at this package, not at an outdated test runner. PHPUnit lives in
      # the root require-dev (testbench requires it directly), so this is a
      # partial root update rather than php-core's vendor-bin update.
      - name: Update PHPUnit to the latest release
        run: composer update phpunit/phpunit --with-all-dependencies --no-interaction --no-progress --ignore-platform-req=php+

      - name: Run tests
        run: vendor/bin/phpunit
